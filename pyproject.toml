[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-structure-qc"
version = "0.2.0"
description = "Chemical structure validation, canonicalization, and quality control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vishal Nagar"}]
keywords = ["cheminformatics", "RDKit", "SMILES", "chemical-data-quality"]
dependencies = [
  "pandas>=2.0",
  "rdkit>=2025.3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
chem-structure-qc = "chem_structure_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
