[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-structure-qc"
version = "0.1.0"
description = "A reproducible cheminformatics pipeline for chemical structure validation and QC"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vishal Nagar"}]
dependencies = [
  "pandas>=2.0",
  "rdkit>=2025.3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
chem-structure-qc = "chem_structure_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
